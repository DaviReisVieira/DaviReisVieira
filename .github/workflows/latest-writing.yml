name: Latest writing

# Once a day: refresh the "Latest Writing" block from davireis.com and commit it.
on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh README
        run: python3 .github/scripts/update_readme.py

      - name: Commit
        run: |
          git config user.name "Davi Reis Vieira"
          git config user.email "36394034+DaviReisVieira@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update latest writing"
          git push
